[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["templates/*.html", "assets/*.css", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/defaults/*.png"]
# app.core.reporting.assets is a package: its own files are relative to it.
"app.core.reporting.assets" = ["*.css", "fonts/*.ttf", "fonts/*.txt", "defaults/*.png"]

[project]
name = "iorp-backend"
version = "0.1.0"
description = "IORP FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "pyotp>=2.10,<3",
    "cryptography>=43,<51",
    "jinja2>=3.1.6,<4",
    "httpx>=0.27,<1",
    "Pillow>=11,<13",
    "pypdf>=5,<7",
    "openpyxl>=3.1,<4",
    "alembic>=1.13,<2.0",
    "email-validator>=2.1,<3.0",
    "fastapi>=0.120,<1.0",
    "starlette>=0.49.1,<1.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<4.1",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-multipart>=0.0.22,<1.0",
    "python-jose[cryptography]>=3.5,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pymupdf>=1.25,<2",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
