services:
  backend:
    profiles: [app]
    build:
      context: ./backend
      target: runtime
      additional_contexts:
        shared: ./shared
    environment:
      APP_ENV: development
      EMAIL_MODE: console
      DATABASE_URL: postgresql+psycopg://iorp:iorp@postgres:5432/iorp
      REPORT_RENDERER_URL: http://report-gateway
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [postgres, report-gateway]
  frontend:
    profiles: [app]
    build:
      context: ./frontend
      additional_contexts:
        shared: ./shared
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
  report-renderer:
    image: gotenberg/gotenberg:8.37.0
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --api-disable-download-from=true
      - --webhook-disable=true
      - --chromium-max-concurrency=2
      - --chromium-max-queue-size=4
      - --api-timeout=60s
    volumes:
      - ./backend/app/core/reporting/assets/fonts:/usr/local/share/fonts/reports:ro
    networks: [renderer]
  report-gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:3005:80"
    volumes:
      - ./backend/app/core/reporting/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, renderer]
    depends_on: [report-renderer]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iorp
      POSTGRES_USER: iorp
      POSTGRES_PASSWORD: iorp
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  renderer:
    internal: true
